<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>To-Do List</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>📝 My To-Do List</h1>
        <form method="POST">
            <input type="text" name="task" placeholder="Enter a new task" required>
            <button type="submit">Add Task</button>
        </form>

        <ul>
            {% for task in tasks %}
                <li>
                    {{ task }}
                    <form method="POST" style="display:inline;">
                        <button type="submit" name="remove" value="{{ loop.index0 }}">❌</button>
                    </form>
                </li>
            {% endfor %}
        </ul>
    </div>
</body>
</html>
